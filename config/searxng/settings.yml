# Minimal SearXNG config for programmatic discovery.
# The application explicitly targets Bing using !bing query syntax.
use_default_settings: true

server:
  secret_key: "change_me_please"
  limiter: false
  image_proxy: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

# Keep only Bing enabled in the bundled instance. Additional providers can
# still be used through the application's pluggable search-provider layer.
engines:
  - name: google
    disabled: true
  - name: duckduckgo
    disabled: true
  - name: bing
    disabled: false
  - name: brave
    disabled: true
  - name: mojeek
    disabled: true
