[project]
name = "bing-link-finder"
version = "1.0.0"
description = "Always-on backlink opportunity discovery, verification and classification engine"
requires-python = ">=3.11"

[project.scripts]
blf = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
