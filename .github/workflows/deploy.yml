name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required repository secrets:
#   VPS_HOST, VPS_USER, VPS_SSH_KEY  (and optionally VPS_PORT, VPS_PATH)
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: ssh deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_PATH || '~/bing-link-finder' }}
            git pull --ff-only
            docker compose up -d --build
            docker compose ps
